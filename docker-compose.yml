services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: teste-fullstack-app
    container_name: teste-fullstack-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - teste-fullstack

  nginx:
    image: nginx:alpine
    container_name: teste-fullstack-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - teste-fullstack
    depends_on:
      - app
      - node

  mysql:
    image: mysql:8.0
    container_name: teste-fullstack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - teste-fullstack

  redis:
    image: redis:7-alpine
    container_name: teste-fullstack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - teste-fullstack

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste-fullstack-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --queue=sync,default --tries=3 --backoff=3
    networks:
      - teste-fullstack
    depends_on:
      - mysql
      - redis

  node:
    image: node:20-alpine
    container_name: teste-fullstack-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run build"
    networks:
      - teste-fullstack

  n8n:
    image: n8nio/n8n
    container_name: teste-fullstack-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - teste-fullstack

networks:
  teste-fullstack:
    driver: bridge

volumes:
  mysql-data:
  n8n-data: